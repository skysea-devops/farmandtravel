name: Frontend Deploy

# Builds the SPA and publishes it to S3 + CloudFront (topraklayeniden.com).
#   - push to prod (frontend/** changes): deploy
#   - after a successful Terraform run on prod: deploy (first rollout)
#   - manual: workflow_dispatch
# Skips cleanly until the site bucket exists (races an in-progress apply).
on:
  push:
    branches: [prod]
    paths: ["frontend/**", ".github/workflows/frontend-deploy.yml"]
  workflow_run:
    workflows: ["Terraform"]
    types: [completed]
    branches: [prod]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  DEPLOY_ROLE: arn:aws:iam::191072269876:role/farmandtravel-prod-tf-deploy
  BUCKET: farmandtravel-prod-site
  DOMAIN: topraklayeniden.com

jobs:
  deploy:
    name: build & publish
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: publish to S3 + invalidate CloudFront
        run: |
          set -euo pipefail

          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Site bucket not present yet (Terraform apply not finished). Skipping."
            exit 0
          fi

          # Hashed assets: cache forever. HTML entries (index.html + the English
          # index.en.html): never cache — they change every deploy (new asset hashes).
          aws s3 sync frontend/dist "s3://$BUCKET" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude index.html --exclude index.en.html
          aws s3 cp frontend/dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache"
          aws s3 cp frontend/dist/index.en.html "s3://$BUCKET/index.en.html" \
            --cache-control "no-cache"

          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Aliases.Items, '$DOMAIN')].Id | [0]" \
            --output text)
          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*" >/dev/null
            echo "Invalidated CloudFront $DIST_ID"
          fi
          echo "Frontend published to https://$DOMAIN"
